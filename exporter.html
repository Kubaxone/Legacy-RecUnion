<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>account data grabber [=)]</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
    }

    body {
        margin: 0;
        height: 100vh;
        background: #0b0b0d;
        color: #e6e6e6;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        width: 340px;
    }

    .prompt {
        font-size: 15px;
        color: #9a9aa3;
        margin-bottom: 10px;
        transition: opacity 0.3s ease;
    }

    input {
        width: 100%;
        padding: 14px 0;
        border: none;
        border-bottom: 1px solid #2a2a30;
        background: transparent;
        color: #fff;
        font-size: 20px;
        outline: none;
        transition: border-color 0.2s, transform 0.15s;
    }

    input::placeholder {
        color: #555;
    }

    input:focus {
        border-color: #4a4a52;
        transform: translateY(-1px);
    }

    .status {
        margin-top: 10px;
        font-size: 12px;
        color: #6f6f78;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .status.show {
        opacity: 1;
        transform: translateY(0);
    }
</style>

</head>
<body>

<div class="container">
    <div class="prompt">enter your username!</div>
    <input id="username" placeholder="username" autofocus>
    <div id="status" class="status">Opening profile...</div>
</div>

<script>
const input = document.getElementById("username");
const status = document.getElementById("status");

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        const username = input.value.trim();
        if (!username) return;

        const url = "https://apim.rec.net/accounts/account/search?name=" + encodeURIComponent(username);

        // step 1: initial feedback
        status.textContent = "Resolving...";
        status.classList.add("show");

        // step 2: slight delay → feels like processing
        setTimeout(() => {
            status.textContent = "Fetching account...";

            // step 3: final delay before action
            setTimeout(() => {

                window.open(url, "_blank");

                // try to close tab
                setTimeout(() => {
                    window.close();

                    // fallback → refresh
                    setTimeout(() => {
                        window.location.reload();
                    }, 300);

                }, 200);

            }, 500); // main delay (tweak this)

        }, 350);
    }
});
</script>

</body>
</html>
