<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RecNet Clone</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f1a;
    color: white;
}

/* NAVBAR */
.nav {
    background: #0f172a;
    padding: 15px 25px;
    font-size: 20px;
    font-weight: bold;
    border-bottom: 1px solid #1f2937;
}

/* SECTION */
.section {
    padding: 20px;
}

.section h2 {
    margin-bottom: 10px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 15px;
}

/* CARD */
.card {
    background: #111827;
    border-radius: 12px;
    overflow: hidden;
    transition: 0.2s;
    cursor: pointer;
}

.card:hover {
    transform: scale(1.04);
}

/* IMAGE */
.card img {
    width: 100%;
    height: 170px;
    object-fit: cover;
}

/* INFO */
.info {
    padding: 10px;
}

.name {
    font-weight: bold;
    font-size: 15px;
}

.meta {
    font-size: 12px;
    color: #9ca3af;
}
</style>
</head>

<body>

<div class="nav">RecNet Clone</div>

<div class="section">
    <h2>🔥 Hot Rooms</h2>
    <div class="grid" id="hot"></div>
</div>

<div class="section">
    <h2>🎮 Rooms</h2>
    <div class="grid" id="rooms"></div>
</div>

<script>
async function fetchRooms(url, containerId) {
    try {
        const res = await fetch(url);
        const data = await res.json();

        const container = document.getElementById(containerId);
        container.innerHTML = "";

        data.forEach(room => {
            const image = room.ImageName
                ? `https://img.rec.net/${room.ImageName}`
                : "https://via.placeholder.com/300x170";

            const players = room.PlayerCount || 0;
            const visits = room.Stats?.VisitCount || 0;

            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <img src="${image}">
                <div class="info">
                    <div class="name">${room.Name}</div>
                    <div class="meta">👥 ${players} players</div>
                    <div class="meta">👁 ${visits} visits</div>
                </div>
            `;

            container.appendChild(card);
        });

    } catch (e) {
        console.error("API failed:", e);
    }
}

/* LOAD MULTIPLE SECTIONS */
fetchRooms("https://apim.rec.net/api/v1/rooms/hot", "hot");
fetchRooms("https://apim.rec.net/api/v1/rooms?take=60", "rooms");

</script>

</body>
</html>
